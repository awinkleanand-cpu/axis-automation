name: Axis Max Life Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn -B clean compile test-compile

  e2e-test:
    name: Run Selenium E2E Tests (Self-Hosted)
    needs: build
    runs-on: [self-hosted, windows, axis-maxlife-uat]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify prerequisites
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"

          $errors = @()

          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            $errors += "Java 17+ not found in PATH"
          } else {
            java -version
          }

          if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
            $errors += "Maven not found in PATH"
          } else {
            mvn -version
          }

          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            $errors += "Google Chrome not found"
          } else {
            & $chrome --version
          }

          if ($errors.Count -gt 0) {
            Write-Error ($errors -join "; ")
            exit 1
          }

      - name: Check UAT portal connectivity
        shell: pwsh
        run: |
          try {
            $response = Invoke-WebRequest -Uri "https://mprouat.axismaxlife.com" -UseBasicParsing -TimeoutSec 30
            Write-Host "UAT portal reachable - HTTP $($response.StatusCode)"
          } catch {
            Write-Warning "UAT portal may be unreachable: $($_.Exception.Message)"
            Write-Warning "Ensure this machine is connected to VPN/corporate network."
          }

      - name: Run automation tests
        shell: pwsh
        run: mvn -B test
        env:
          CI: true
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INSURANCE_USER_ID: ${{ secrets.INSURANCE_USER_ID }}
          INSURANCE_PASSWORD: ${{ secrets.INSURANCE_PASSWORD }}

      - name: Publish test summary
        if: always()
        shell: pwsh
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Automation Test Results"
          Add-Content -Path $summaryFile -Value ""
          Add-Content -Path $summaryFile -Value "**Runner:** $env:RUNNER_NAME (self-hosted)"

          $resultsPath = "test-output/results/test-results.json"
          if (Test-Path $resultsPath) {
            $results = Get-Content $resultsPath | ConvertFrom-Json
            Add-Content -Path $summaryFile -Value ""
            Add-Content -Path $summaryFile -Value "| Metric | Count |"
            Add-Content -Path $summaryFile -Value "|---|---|"
            Add-Content -Path $summaryFile -Value "| Passed | $($results.passed) |"
            Add-Content -Path $summaryFile -Value "| Failed | $($results.failed) |"
            Add-Content -Path $summaryFile -Value "| Skipped | $($results.skipped) |"
            Add-Content -Path $summaryFile -Value "| Total | $($results.total) |"
            Add-Content -Path $summaryFile -Value ""
            Add-Content -Path $summaryFile -Value "Generated at: $($results.generatedAt)"
            Add-Content -Path $summaryFile -Value ""
            Add-Content -Path $summaryFile -Value "### Test Details"
            Add-Content -Path $summaryFile -Value ""
            foreach ($test in $results.tests) {
              $errorText = if ($test.error) { " - $($test.error)" } else { "" }
              Add-Content -Path $summaryFile -Value "- **$($test.testName)**: $($test.status) ($($test.durationMs) ms)$errorText"
            }
          } else {
            Add-Content -Path $summaryFile -Value "Test result file was not generated. Check workflow logs."
          }

          Add-Content -Path $summaryFile -Value ""
          Add-Content -Path $summaryFile -Value "Download the **automation-reports** artifact for Extent HTML, Excel, screenshots, and logs."

      - name: Upload automation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ github.run_number }}
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 14

      - name: Fail workflow if tests failed
        if: always()
        shell: pwsh
        run: |
          $resultsPath = "test-output/results/test-results.json"
          if (Test-Path $resultsPath) {
            $results = Get-Content $resultsPath | ConvertFrom-Json
            if ($results.failed -gt 0) {
              Write-Error "Tests failed: $($results.failed)"
              exit 1
            }
          } elseif (Test-Path "target/surefire-reports/testng-results.xml") {
            $xml = [xml](Get-Content "target/surefire-reports/testng-results.xml")
            $failed = [int]$xml.'testng-results'.failed
            if ($failed -gt 0) {
              Write-Error "Tests failed: $failed"
              exit 1
            }
          }
